<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos | CARZE</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --sw:220px;--bg:#f0f2f5;--white:#fff;--naranja:#f97316;--naranja2:#ea580c;
  --azul:#1a3a6b;--azul2:#1e40af;--border:#e4e8ef;--txt:#1e293b;--muted:#64748b;--light:#f8fafc;
  --verde:#16a34a;--rojo:#dc2626;--amarillo:#f59e0b;--morado:#9333ea;
}
html,body{height:100%;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
/* MAIN */
.main{margin-left:var(--sw);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:13px 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-left h1{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;color:var(--naranja)}
.topbar-left p{font-size:.7rem;color:var(--muted);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:10px}
.user-badge{display:flex;align-items:center;gap:8px;background:var(--light);border:1px solid var(--border);border-radius:50px;padding:6px 14px 6px 8px}
.user-avatar{width:28px;height:28px;background:linear-gradient(135deg,var(--naranja),var(--naranja2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff}
.user-name{font-size:.75rem;font-weight:700;color:var(--txt)}
.btn-logout{display:flex;align-items:center;gap:7px;padding:7px 15px;border:1.5px solid #fecaca;border-radius:9px;background:transparent;color:#dc2626;font-family:inherit;font-size:.77rem;font-weight:700;cursor:pointer;transition:all .2s}
.btn-logout:hover{background:#dc2626;color:#fff}

/* CONTENT */
.content{flex:1;overflow:hidden;display:flex;gap:0}

/* CALENDARIO */
.cal-section{flex:1;padding:20px 20px 20px 24px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.cal-mes{font-family:'Syne',sans-serif;font-size:1.25rem;font-weight:800;color:var(--azul)}
.cal-mes span{color:var(--naranja)}
.cal-nav{display:flex;gap:8px}
.cal-nav-btn{width:34px;height:34px;background:var(--white);border:1.5px solid var(--border);border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:all .2s;font-size:.9rem}
.cal-nav-btn:hover{background:var(--naranja);border-color:var(--naranja);color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:.65rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:6px 0;margin-bottom:2px}
.cal-dow.fin{color:#dc2626}
.cal-day{min-height:88px;background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:7px 8px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.cal-day:hover{border-color:var(--naranja);box-shadow:0 3px 12px rgba(249,115,22,.15)}
.cal-day.otro-mes{background:var(--light);opacity:.5;cursor:default}
.cal-day.otro-mes:hover{border-color:var(--border);box-shadow:none}
.cal-day.hoy{border-color:var(--naranja);border-width:2px;background:#fff8f5}
.cal-day.hoy .cal-day-num{background:var(--naranja);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:800}
.cal-day.tiene-eventos{background:#fffbf5}
.cal-day-num{font-size:.78rem;font-weight:700;color:var(--txt);margin-bottom:4px}
.cal-day.fin-semana .cal-day-num{color:#dc2626}
.cal-evento-dot{font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:6px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:opacity .15s}
.cal-evento-dot:hover{opacity:.8}
.cal-add-btn{position:absolute;bottom:4px;right:4px;width:18px;height:18px;background:var(--naranja);border-radius:50%;display:none;align-items:center;justify-content:center;color:#fff;font-size:.75rem;font-weight:800;cursor:pointer}
.cal-day:hover .cal-add-btn{display:flex}
.cal-day.otro-mes .cal-add-btn{display:none!important}

/* PANEL LATERAL */
.panel-section{width:300px;flex-shrink:0;border-left:1px solid var(--border);background:var(--white);display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:16px 18px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.panel-title{font-family:'Syne',sans-serif;font-size:.9rem;font-weight:800;color:var(--azul);margin-bottom:2px}
.panel-sub{font-size:.68rem;color:var(--muted)}
.panel-body{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;padding:12px}
.panel-empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:.76rem;display:flex;flex-direction:column;align-items:center;gap:8px}
.panel-empty .ei{font-size:2.5rem;opacity:.2}
.panel-add-btn{margin:12px;flex-shrink:0}
.btn-add{width:100%;padding:10px;background:var(--naranja);border:none;border-radius:10px;color:#fff;font-family:inherit;font-size:.82rem;font-weight:800;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-add:hover{background:var(--naranja2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(249,115,22,.4)}

/* EVENTO CARD */
.evento-card{background:var(--light);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:all .18s;position:relative;border-left-width:4px}
.evento-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.07);transform:translateY(-1px)}
.evento-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:4px}
.evento-card-title{font-size:.78rem;font-weight:700;color:var(--txt);line-height:1.3}
.evento-card-fecha{font-size:.65rem;color:var(--muted);white-space:nowrap}
.evento-card-tipo{font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:20px;margin-bottom:5px;display:inline-block}
.evento-card-desc{font-size:.7rem;color:var(--muted);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.evento-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.estado-badge{font-size:.58rem;font-weight:700;padding:2px 7px;border-radius:20px}
.est-pendiente{background:#fef9c3;color:#a16207;border:1px solid #fde68a}
.est-realizado{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
.est-vencido{background:#fee2e2;color:#dc2626;border:1px solid #fecaca}
.ev-actions{display:flex;gap:4px}
.ev-btn{background:none;border:none;cursor:pointer;font-size:.8rem;padding:2px 4px;border-radius:4px;transition:background .15s}
.ev-btn:hover{background:var(--border)}

/* TIPOS */
.tipo-reunion{color:#1e40af;background:#eff6ff;border:1px solid #bfdbfe}
.tipo-visita{color:#c2410c;background:#fff7ed;border:1px solid #fed7aa}
.tipo-documentos{color:#15803d;background:#dcfce7;border:1px solid #bbf7d0}
.tipo-pago{color:#dc2626;background:#fee2e2;border:1px solid #fecaca}
.tipo-pendiente{color:#9333ea;background:#faf5ff;border:1px solid #e9d5ff}
.tipo-otro{color:#475569;background:#f1f5f9;border:1px solid #e2e8f0}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:18px;width:92%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.22);transform:translateY(24px) scale(.98);transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .25s;opacity:0;scrollbar-width:thin;position:relative}
.overlay.open .modal{transform:translateY(0) scale(1);opacity:1}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--azul),var(--naranja));border-radius:18px 18px 0 0}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 14px}
.modal-head h2{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:var(--azul)}
.modal-head h2 span{color:var(--naranja)}
.modal-close{width:32px;height:32px;background:var(--light);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:all .2s;flex-shrink:0}
.modal-close:hover{background:#fff1f2;border-color:#fecdd3;color:#dc2626}
.modal-body{padding:0 24px 24px}
.modal-foot{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.btn-cancel{background:var(--light);border:1.5px solid var(--border);color:var(--muted);font-family:inherit;font-size:.8rem;font-weight:700;padding:9px 20px;border-radius:9px;cursor:pointer;transition:all .2s}
.btn-cancel:hover{border-color:#fecdd3;color:#dc2626}
.btn-save{background:var(--naranja);border:none;color:#fff;font-family:inherit;font-size:.82rem;font-weight:800;padding:10px 24px;border-radius:9px;cursor:pointer;transition:all .2s}
.btn-save:hover{background:var(--naranja2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(249,115,22,.35)}
.btn-save:disabled{background:#cbd5e1;cursor:not-allowed;transform:none;box-shadow:none}
.frow{margin-bottom:13px}
.frow label{display:block;font-size:.72rem;font-weight:700;color:var(--txt);margin-bottom:5px}
.req{color:var(--naranja)}
.finput,.fselect,.ftextarea{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:.8rem;font-family:inherit;color:var(--txt);background:#fff;transition:all .2s}
.finput:focus,.fselect:focus,.ftextarea:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px rgba(249,115,22,.08)}
.finput::placeholder,.ftextarea::placeholder{color:#94a3b8}
.ftextarea{resize:vertical;min-height:70px}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* TIPO SELECTOR */
.tipo-selector{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:4px}
.tipo-opt{padding:8px 6px;border:1.5px solid var(--border);border-radius:9px;text-align:center;cursor:pointer;font-size:.7rem;font-weight:700;transition:all .2s;background:var(--white)}
.tipo-opt:hover{border-color:var(--naranja)}
.tipo-opt.sel{border-width:2px}
.tipo-opt.sel-reunion{border-color:#1e40af;background:#eff6ff;color:#1e40af}
.tipo-opt.sel-visita{border-color:#c2410c;background:#fff7ed;color:#c2410c}
.tipo-opt.sel-documentos{border-color:#15803d;background:#dcfce7;color:#15803d}
.tipo-opt.sel-pago{border-color:#dc2626;background:#fee2e2;color:#dc2626}
.tipo-opt.sel-pendiente{border-color:#9333ea;background:#faf5ff;color:#9333ea}
.tipo-opt.sel-otro{border-color:#475569;background:#f1f5f9;color:#475569}

/* CONFIRM */
.confirm-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:400;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.confirm-overlay.open{opacity:1;pointer-events:all}
.confirm-box{background:#fff;border-radius:16px;padding:26px 28px;max-width:340px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2);transform:scale(.95);transition:transform .25s cubic-bezier(.34,1.56,.64,1);position:relative}
.confirm-overlay.open .confirm-box{transform:scale(1)}
.confirm-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#dc2626,#f87171);border-radius:16px 16px 0 0}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;z-index:999;padding:13px 20px;border-radius:11px;font-size:.82rem;font-weight:700;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18);transform:translateY(20px);opacity:0;transition:all .3s;pointer-events:none;max-width:320px}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{background:#16a34a}.toast.err{background:#dc2626}.toast.warn{background:#f59e0b}
.mascota{position:fixed;bottom:0;left:calc(var(--sw)+12px);width:86px;pointer-events:none;z-index:10;opacity:.82}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>


<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <h1>Agenda de Eventos</h1>
      <p>CARZE Contratistas Generales S.A.C.</p>
    </div>
    <div class="topbar-right">
      <div class="user-badge">
        <div class="user-avatar" id="avatarInitials">?</div>
        <span class="user-name" id="userName">Usuario</span>
      </div>
      <button class="btn-logout" onclick="cerrarSesion()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar Sesión
      </button>
    </div>
  </div>

  <div class="content">

    <!-- CALENDARIO -->
    <div class="cal-section">
      <div class="cal-header">
        <div class="cal-mes" id="calMesLabel">— <span>—</span></div>
        <div class="cal-nav">
          <button class="cal-nav-btn" onclick="cambiarMes(-1)" title="Mes anterior">‹</button>
          <button class="cal-nav-btn" onclick="irHoy()" title="Ir a hoy" style="font-size:.65rem;font-weight:800;width:auto;padding:0 10px">HOY</button>
          <button class="cal-nav-btn" onclick="cambiarMes(1)" title="Mes siguiente">›</button>
        </div>
      </div>
      <!-- Días de la semana -->
      <div class="cal-grid" id="calDow"></div>
      <!-- Días del mes -->
      <div class="cal-grid" id="calGrid" style="margin-top:4px"></div>
    </div>

    <!-- PANEL LATERAL -->
    <div class="panel-section">
      <div class="panel-head">
        <div class="panel-title" id="panelTitle">Eventos del mes</div>
        <div class="panel-sub" id="panelSub">Cargando...</div>
      </div>
      <div class="panel-add-btn">
        <button class="btn-add" onclick="abrirModal(null)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nuevo Evento
        </button>
      </div>
      <div class="panel-body" id="panelBody">
        <div class="panel-empty"><div class="ei">📅</div><p>Cargando eventos...</p></div>
      </div>
    </div>

  </div>
</div>

<img src="img/mascota_carze.png" alt="" class="mascota" onerror="this.style.display='none'">
<div class="toast" id="toast"></div>

<!-- MODAL EVENTO -->
<div class="overlay" id="overlay" onclick="if(event.target===this)cerrarModal()">
<div class="modal">
  <div class="modal-head">
    <h2 id="modalTitle">Nuevo <span>Evento</span></h2>
    <button class="modal-close" onclick="cerrarModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="modal-body">
    <!-- Tipo -->
    <div class="frow">
      <label>Tipo de Evento <span class="req">*</span></label>
      <div class="tipo-selector">
        <div class="tipo-opt" data-tipo="reunion" onclick="setTipo('reunion')">🔵 Reunión</div>
        <div class="tipo-opt" data-tipo="visita" onclick="setTipo('visita')">🟠 Visita Técnica</div>
        <div class="tipo-opt" data-tipo="documentos" onclick="setTipo('documentos')">🟢 Documentos</div>
        <div class="tipo-opt" data-tipo="pago" onclick="setTipo('pago')">🔴 Pago / Cobro</div>
        <div class="tipo-opt" data-tipo="pendiente" onclick="setTipo('pendiente')">🟣 Pendiente</div>
        <div class="tipo-opt" data-tipo="otro" onclick="setTipo('otro')">⚫ Otro</div>
      </div>
    </div>
    <!-- Título -->
    <div class="frow">
      <label>Título <span class="req">*</span></label>
      <input class="finput" id="eTitulo" placeholder="Ej: Visita tienda Sodimac Piura, Envío documentos firma...">
    </div>
    <!-- Fecha y Hora -->
    <div class="form-grid-2">
      <div class="frow">
        <label>Fecha <span class="req">*</span></label>
        <input class="finput" id="eFecha" type="date">
      </div>
      <div class="frow">
        <label>Hora (opcional)</label>
        <input class="finput" id="eHora" type="time" placeholder="10:00">
      </div>
    </div>
    <!-- Descripción -->
    <div class="frow">
      <label>Descripción / Detalle</label>
      <textarea class="ftextarea" id="eDesc" placeholder="Detalles del evento, qué se debe hacer, con quién, dónde..."></textarea>
    </div>
    <!-- Estado -->
    <div class="frow">
      <label>Estado</label>
      <select class="fselect" id="eEstado">
        <option value="pendiente">⏳ Pendiente</option>
        <option value="realizado">✅ Realizado</option>
      </select>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
    <button class="btn-save" id="btnGuardar" onclick="guardar()"><span id="btnGuardarTxt">GUARDAR</span></button>
  </div>
</div>
</div>

<!-- CONFIRM -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div style="font-size:2rem;margin-bottom:8px">🗑️</div>
    <div style="font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;color:var(--txt);margin-bottom:6px">¿Eliminar evento?</div>
    <div style="font-size:.8rem;color:var(--muted)" id="confirmMsg"></div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
      <button style="padding:8px 20px;border:1.5px solid var(--border);border-radius:9px;background:var(--light);color:var(--muted);font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer" onclick="cerrarConfirm()">Cancelar</button>
      <button style="padding:8px 20px;border:none;border-radius:9px;background:#dc2626;color:#fff;font-family:inherit;font-size:.8rem;font-weight:800;cursor:pointer" id="confirmOkBtn">Sí, eliminar</button>
    </div>
  </div>
</div>

<script type="module" src="eventos.js"></script>
<script src="sidebar.js"></script>
<script type="module" src="carzecito-bridge.js"></script>
<script src="carzecito.js" defer></script>
</body>
</html>
